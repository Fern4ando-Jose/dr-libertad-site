name: Instagram — publicar posts (ES + PT)

# Agendamento gratuito via GitHub Actions (substitui os crons do Vercel).
# 1 CARROSSEL/dia por idioma (run 4 — tópico distinto dos Reels, que usam 0 e 2 vídeo + 3 clássico).
# O run 5 existe no código para backfill manual, mas NÃO tem mais cron (cadência 4/dia, 27/07).
#
# WORKFLOW ÚNICO ES+PT (fusão 2026-07-14): antes eram 2 arquivos quase idênticos
# (instagram-posts.yml + instagram-posts-pt.yml) que DIVERGIAM à mão. Agora o
# `lang` é derivado da EXPRESSÃO cron (github.event.schedule), do mesmo jeito que o
# `run` — assim ES e PT nunca mais saem de sincronia (fonte única do job). ES dispara
# em :17 e PT em :22 (5 min depois, p/ reusar a ilustração já cacheada pelo ES).
# `run` também vem da expressão cron, não do relógio (atraso do cron não colide com o vizinho).
on:
  schedule:
    # Cadência 4/dia por idioma (determinação do dono 19/07, aplicada 27/07): 1 carrossel
    # por idioma. O run 5 (14:17) foi RETIRADO — ver RUN_HOUR_BRT em src/lib/day.ts (fonte única).
    - cron: "17 12 * * *" # 09:17 BRT — ES run 4
    - cron: "22 12 * * *" # 09:22 BRT — PT run 4 (5 min após o ES)
  workflow_dispatch:
    inputs:
      lang:
        description: "Idioma (es | pt). Default es."
        required: false
        default: "es"
      run:
        description: "Run específico 0..6 p/ backfill de um horário. Vazio = usa slot/topic."
        required: false
        default: ""
      slot:
        description: "Slot a publicar (manha | tarde | noite). Vazio = publica os 3."
        required: false
        default: ""
      topic:
        description: "Forçar um tópico específico (override). Vazio = tópico do dia. Use com 1 slot p/ não publicar 3x."
        required: false
        default: ""
      force:
        description: "Ignorar a trava anti-duplicata de 24h (republicar/backfill)."
        type: boolean
        required: false
        default: false

# ES e PT têm expressões cron distintas (:17 vs :22) → grupos distintos → não se
# bloqueiam. cancel-in-progress:false garante que nada em voo seja cancelado.
concurrency:
  group: instagram-posts-${{ github.event.schedule || github.event.inputs.lang || 'manual' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Determinar run e idioma pelo horário
        id: params
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_LANG: ${{ github.event.inputs.lang }}
          IN_RUN: ${{ github.event.inputs.run }}
          IN_SLOT: ${{ github.event.inputs.slot }}
          IN_TOPIC: ${{ github.event.inputs.topic }}
          IN_FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Disparo manual (inclui catchup/guardião): lang/run/slot/topic/force conforme informado.
            LANG="${IN_LANG:-es}"
            echo "run=$IN_RUN" >> "$GITHUB_OUTPUT"
            echo "slot=$IN_SLOT" >> "$GITHUB_OUTPUT"
            echo "topic=$IN_TOPIC" >> "$GITHUB_OUTPUT"
            echo "force=$IN_FORCE" >> "$GITHUB_OUTPUT"
          else
            # Agendado: run E idioma derivados da EXPRESSÃO cron que disparou.
            case "$SCHEDULE" in
              "17 12 * * *") RUN=4; LANG=es ;;
              "17 17 * * *") RUN=5; LANG=es ;;
              "22 12 * * *") RUN=4; LANG=pt ;;
              "22 17 * * *") RUN=5; LANG=pt ;;
              *) RUN=4; LANG=es ;;  # fallback defensivo
            esac
            echo "run=$RUN" >> "$GITHUB_OUTPUT"
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "topic=" >> "$GITHUB_OUTPUT"
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi
          [ "$LANG" != "pt" ] && LANG=es  # normaliza qualquer valor inesperado p/ es
          echo "lang=$LANG" >> "$GITHUB_OUTPUT"
          echo "Parâmetros: run='${RUN:-$IN_RUN}' lang='$LANG'"

      - name: Chamar endpoint de publicação
        env:
          AUTH: ${{ secrets.CRON_SECRET }}
          SITE: ${{ secrets.SITE_URL }}
          LANG: ${{ steps.params.outputs.lang }}
          RUN: ${{ steps.params.outputs.run }}
          SLOT: ${{ steps.params.outputs.slot }}
          TOPIC: ${{ steps.params.outputs.topic }}
          FORCE: ${{ steps.params.outputs.force }}
        run: |
          # URL base por idioma: es = sem query (default da API); pt = ?lang=pt.
          URL="$SITE/api/publish"
          [ "$LANG" = "pt" ] && URL="$SITE/api/publish?lang=pt"
          # Monta a query com -G --data-urlencode (lida com espaços no tópico).
          ARGS=(-sS -o response.json -w "%{http_code}" -G)
          ARGS+=(-H "Authorization: Bearer $AUTH")
          [ -n "$RUN" ]   && ARGS+=(--data-urlencode "run=$RUN")
          [ -n "$SLOT" ]  && ARGS+=(--data-urlencode "slot=$SLOT")
          [ -n "$TOPIC" ] && ARGS+=(--data-urlencode "topic=$TOPIC")
          [ "$FORCE" = "true" ] && ARGS+=(--data-urlencode "force=1")
          echo "Publicando ($LANG): run='${RUN}' slot='${SLOT}' topic='${TOPIC}' force='${FORCE}'"
          HTTP_CODE=$(curl "${ARGS[@]}" "$URL")
          echo "HTTP $HTTP_CODE"
          echo "--- resposta ---"
          cat response.json
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Falha na publicação (HTTP $HTTP_CODE, lang=$LANG)"
            exit 1
          fi
