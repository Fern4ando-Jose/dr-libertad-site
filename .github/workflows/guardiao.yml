name: Guardião — verifica 6/6 posts do dia nas 2 contas

# ROTINA DIÁRIA de vigilância (pedido do dono 2026-07-07: "os 6 posts rodam nos 2
# IGs, e VOCÊ vigia, não eu"). Roda no FIM DO DIA (23h40 BRT), depois de todas as 6
# vagas × 2 idiomas terem vencido e do catchup de hora em hora ter tentado. Faz 3
# coisas via /api/guardian:
#   1. VERIFICA se as 6 vagas publicaram em CADA conta (ES + PT);
#   2. PERSISTE o veredito do dia em `daily_report` (o painel-adm lê p/ alertar o dono);
#   3. ÚLTIMA VARREDURA: redispara vagas `missing` recuperáveis (idempotente, como o catchup).
# O que ele NÃO faz sozinho: regenerar capa PAGA de uma vaga que desistiu (§1.4 — isso
# escala pro dono). Com a Nano Banana as reprovações devem ser raras.

on:
  schedule:
    - cron: "40 2 * * *" # 02:40 UTC = 23:40 BRT (fim do dia)
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

concurrency:
  group: guardiao
  cancel-in-progress: false

jobs:
  guardiao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar 6/6, gravar veredito e dar a última varredura
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          RESP=$(curl -fsS --max-time 45 -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.drlibertad.com/api/guardian")
          echo "guardian: $RESP"

          # Última varredura: redispara SÓ as vagas 'missing' recuperáveis (idempotente —
          # trava por tópico/livro-razão deduplica um cron atrasado que chegue depois).
          echo "$RESP" | jq -c '.missing[]?' | while read -r item; do
            lang=$(echo "$item" | jq -r '.lang')
            run=$(echo "$item" | jq -r '.run')
            case "$run" in
              0|1|2|6) base="instagram-reels";          extra="-f publish=yes" ;;
              3)       base="instagram-reels-classic";  extra="-f publish=yes" ;;
              4|5)     base="instagram-posts";          extra="" ;;
              *)       echo "run $run desconhecido — pulando"; continue ;;
            esac
            # Workflow ÚNICO por formato (fusão ES+PT 2026-07-14): o idioma vai por -f lang.
            wf="${base}.yml"
            echo "::notice title=Guardião::última varredura — redisparando $wf run=$run ($lang)"
            # shellcheck disable=SC2086
            gh workflow run "$wf" -f run="$run" -f lang="$lang" $extra \
              || echo "::warning::falha ao disparar $wf run=$run ($lang)"
          done

          # Alerta no log do Actions quando o dia NÃO fechou 6/6 (o veredito completo já
          # foi persistido em daily_report → painel-adm mostra pro dono).
          OK=$(echo "$RESP" | jq -r '.ok')
          NOTE=$(echo "$RESP" | jq -r '.note')
          if [ "$OK" != "true" ]; then
            echo "::warning title=Guardião — dia incompleto::$NOTE"
          else
            echo "Guardião: $NOTE"
          fi
