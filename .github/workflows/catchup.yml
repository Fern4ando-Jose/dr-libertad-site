name: Catch-up — redispara posts que o cron do GitHub atrasou/derrubou

# REDE DE SEGURANÇA do agendamento. O scheduler do GitHub atrasa horas ou derruba
# crons → posts somem. Este workflow roda de hora em hora, pergunta ao
# /api/runs-status quais runs do dia (da cadência, por idioma) já venceram e ainda
# NÃO publicaram, e redispara SÓ esses. É idempotente: carrossel tem trava por
# (tópico,conta,7d) e reel tem dedup por (dia,run,conta) no livro-razão
# `published_runs` — então um cron real atrasado que chegue depois é deduplicado
# (não duplica o post). Ver src/lib/run-ledger.ts e /api/runs-status.

on:
  schedule:
    - cron: "0,30 * * * *" # a cada 30 min — recupera cron pulado do GitHub em ≤30min
                           # (era de hora em hora; o GitHub PULA crons agendados, então
                           # o catchup é a rede REAL — mais frequente = buraco menor.
                           # Idempotente: trava por tópico/livro-razão deduplica.)
  workflow_dispatch: {}

# Necessário p/ o GITHUB_TOKEN poder disparar OUTROS workflows (workflow_dispatch
# é exceção à regra anti-recursão do GitHub → o run disparado executa de verdade).
permissions:
  actions: write
  contents: read

concurrency:
  group: catchup
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detectar runs faltantes e redisparar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          RESP=$(curl -fsS --max-time 30 -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.drlibertad.com/api/runs-status")
          echo "runs-status: $RESP"

          echo "$RESP" | jq -c '.missing[]?' | while read -r item; do
            lang=$(echo "$item" | jq -r '.lang')
            run=$(echo "$item" | jq -r '.run')

            case "$run" in
              # Run 3 (19h) é Reel de VÍDEO desde 09/08 (o clássico foi desligado por
              # ordem do dono). Mapear pra instagram-reels-classic redispararia o
              # workflow desligado e a vaga NUNCA sairia — o defeito que este case era.
              0|1|2|3|6) base="instagram-reels";        extra="-f publish=yes" ;;
              4|5)       base="instagram-posts";        extra="" ;;
              *)       echo "run $run desconhecido — pulando"; continue ;;
            esac
            # Workflow ÚNICO por formato (fusão ES+PT 2026-07-14): o idioma vai por -f lang.
            wf="${base}.yml"

            echo "::notice title=Catch-up::redisparando $wf run=$run ($lang)"
            # shellcheck disable=SC2086
            gh workflow run "$wf" -f run="$run" -f lang="$lang" $extra \
              || echo "::warning::falha ao disparar $wf run=$run ($lang)"
          done

          echo "Catch-up concluído."
