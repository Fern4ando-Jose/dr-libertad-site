name: Instagram Reels — Dr. Libertad / Dr. Liberdade (ES + BR)

# Pipeline GRÁTIS de Reels (vídeo) para @dr.liberdad (ES) e @dr.liberdade.br (PT).
# Renderiza com Remotion no GitHub Actions (Chromium + ffmpeg), sobe o mp4 pro
# GitHub Release (ponte) e publica via /api/publish-reel.
#
# COMPOSIÇÃO DE PRODUÇÃO = ReelPassos (delta 2026-08-23, ordem do dono: "pode,
# aplique tudo" — reestruturação total após zero crescimento/+US$3000 gastos sem
# retorno). Molde grid+numeral fantasma+label "PASO 0X"+barra de progresso, fundo
# PRETO PURO sem footage (padrão observado ao vivo em 2 contas do nicho crescendo:
# @estoicodiario, @HONORESTOICO — ver video/ReelPassos.tsx). ReelV2 (footage real
# de banco + grade da marca + gancho cinético) fica de RESERVA, mesmo padrão do
# ReelClassic — não foi apagado, só saiu do render de produção.
#
# WORKFLOW ÚNICO ES+PT (fusão 2026-07-14): antes eram 2 arquivos quase idênticos
# (instagram-reels.yml + instagram-reels-pt.yml) que DIVERGIAM à mão. Agora `lang` é
# derivado da EXPRESSÃO cron (github.event.schedule), do mesmo jeito que o `run` —
# fonte única do job, ES e PT nunca mais saem de sincronia. ES dispara em :17 e PT em
# :22 (5 min depois, p/ ler a arte que o ES já gerou; imagem compartilhada, só a copy muda).
#
# CADÊNCIA 1 PEÇA/DIA (ordem do dono 2026-08-23, reestruturação total das 2 contas:
# "pode, aplique tudo"): 1 Reel de VÍDEO/dia por idioma (run 3, 19h BRT), NA MAIORIA
# dos dias. A cada 3 dias o CARROSSEL (instagram-posts.yml, mesmo horário 19h) toma a
# vaga no lugar do Reel — `/api/publish?preview=1` devolve `skipped:true` sem gastar
# nada nesses dias (`isCarouselDay`, fonte única em src/lib/day.ts). O Reel CLÁSSICO
# (slide animado) segue DESLIGADO desde 09/08. O `run` vem da EXPRESSÃO cron, não do
# relógio — pra atraso do cron não colidir com o run vizinho.
on:
  schedule:
    # Único horário armado: 19h BRT, o mesmo do carrossel — os dois se revezam por
    # dia (ver header acima). Quem manda no conjunto de vagas é RUN_HOUR_BRT em
    # src/lib/day.ts (fonte única); estes crons a espelham.
    - cron: "17 22 * * *" # 19:17 BRT — ES run 3
    - cron: "22 22 * * *" # 19:22 BRT — PT run 3 (5 min após o ES)
  workflow_dispatch:
    inputs:
      lang:
        description: "Idioma (es | br). Default es."
        required: false
        default: "es"
      run:
        description: "Run p/ escolher o tópico (vazio = 3, o único horário ativo; 0/1/2/6 só para backfill manual)"
        required: false
        default: ""
      publish:
        description: "Publicar no Instagram? (no = só renderiza p/ preview)"
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]
      force:
        description: "TEMPORARIO (branch de teste, reverter): força bypass do gate de dia-de-carrossel, só para render de TESTE sem publicar."
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]
      topic:
        description: "TEMPORARIO (branch de teste, reverter): força um tópico específico (chave EXATA do THEMES em ES)."
        required: false
        default: ""

# Um Reel por horário/idioma roda isolado; horários e idiomas diferentes não se cancelam.
concurrency:
  group: instagram-reels-${{ github.event.schedule || github.event.inputs.lang }}-${{ github.event.inputs.run }}
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    # contents: write → o passo de upload cria/atualiza o GitHub Release que hospeda o mp4.
    permissions:
      contents: write
    steps:
      # 1. Baixa o código do repositório
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # 2. Configura Node 20 com cache de npm
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # 3. Instala dependências (inclui Remotion). O Remotion baixa o Chromium
      #    Headless Shell automaticamente no primeiro render.
      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      # 4. Determina `run` E `lang`: da expressão cron (agendado) ou dos inputs (manual/catchup).
      - name: Determinar run e idioma pelo horário
        id: params
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_LANG: ${{ github.event.inputs.lang }}
          IN_RUN: ${{ github.event.inputs.run }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            RUN="${IN_RUN:-3}"   # disparo manual: run informado ou 3 (o único horário ativo)
            LANG="${IN_LANG:-es}"
          else
            case "$SCHEDULE" in
              "17 22 * * *") RUN=3; LANG=es ;;
              "22 22 * * *") RUN=3; LANG=br ;;
              *) RUN=3; LANG=es ;;  # fallback defensivo
            esac
          fi
          [ "$LANG" = "pt" ] && LANG=br  # aceita o codigo LEGADO de chamada antiga (catchup/curl velho)
          [ "$LANG" != "br" ] && LANG=es  # normaliza qualquer valor inesperado p/ es
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "lang=$LANG" >> "$GITHUB_OUTPUT"
          # Sufixo de query e CTA-fallback por idioma (fonte única, sem drift entre ES/PT).
          if [ "$LANG" = "br" ]; then
            echo "langqs=&lang=br" >> "$GITHUB_OUTPUT"
            echo "reelqs=?lang=br" >> "$GITHUB_OUTPUT"
            echo "cta_follow=Siga" >> "$GITHUB_OUTPUT"
            echo "cta_bio=→ Mais no link da bio" >> "$GITHUB_OUTPUT"
          else
            echo "langqs=" >> "$GITHUB_OUTPUT"
            echo "reelqs=" >> "$GITHUB_OUTPUT"
            echo "cta_follow=Sigue" >> "$GITHUB_OUTPUT"
            echo "cta_bio=→ Más en el link de la bio" >> "$GITHUB_OUTPUT"
          fi
          echo "Run escolhido: $RUN (lang=$LANG)"

      # 5. Busca o conteúdo em /api/publish?preview=1[&lang=br]&run=N (gera título/slides/cta +
      #    videoQueries via Claude, SEM publicar) e monta o REEL_PROPS.
      - name: Obter conteúdo (preview) e montar REEL_PROPS
        id: content
        env:
          CTA_FOLLOW: ${{ steps.params.outputs.cta_follow }}
          CTA_BIO: ${{ steps.params.outputs.cta_bio }}
        run: |
          # 402 = FREIO DE GASTO, não defeito. Desde 05/08/2026 o dono zerou os tetos
          # ("pare de gastar meus créditos") e TODA chamada volta 402 — o robô falhava,
          # e cada falha virava e-mail de erro pro dono, várias vezes por dia. Ordem
          # obedecida é estado normal: aqui vira AVISO e o robô encerra em paz.
          # Erro de verdade (401 token vencido, 500, rede) continua derrubando o robô.
          # TEMPO DE ESPERA: 180 s não bastava e o Reel morria ANTES de existir — três
          # execuções seguidas em 09/08 caíram em `curl: (28) Operation timed out after
          # 180001 ms with 0 bytes received`, com a vaga marcada como faltante e nenhum
          # vídeo no ar. O preview faz muita coisa numa chamada só (escreve o texto, passa
          # pelo revisor, escolhe o footage e gera a NARRAÇÃO — a voz é o trecho lento).
          # 480 s dá folga sem cegar nada: o job tem limite próprio, e um site realmente
          # travado ainda derruba o passo, só que 8 min depois em vez de 3.
          FORCEQS=""
          if [ "${{ github.event.inputs.force }}" = "yes" ]; then FORCEQS="&force=1"; fi
          TOPICQS=""
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            TOPICQS="&topic=$(node -e 'console.log(encodeURIComponent(process.argv[1]))' "${{ github.event.inputs.topic }}")"
          fi
          HTTP=$(curl -sS --max-time 480 -o preview.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.drlibertad.com/api/publish?preview=1${{ steps.params.outputs.langqs }}&run=${{ steps.params.outputs.run }}$FORCEQS$TOPICQS" \
            || echo 000)
          if [ "$HTTP" = "402" ]; then
            echo "pulado=1" >> "$GITHUB_OUTPUT"
            echo "::warning title=Reel pulado — gasto desligado::O teto de gasto está em zero (ordem do dono, 05/08/2026). Nada foi publicado. Religar = o dono dizer o número."
            cat preview.json; echo
            exit 0
          fi
          if [ "$HTTP" != "200" ]; then
            echo "::error title=Falha ao obter conteúdo::HTTP $HTTP"
            cat preview.json; echo
            exit 1
          fi
          # Cadência 1 peça/dia (2026-08-23): hoje é dia de CARROSSEL, não de Reel —
          # /api/publish devolve "skipped":true sem gastar nada. Não é defeito.
          if grep -q '"skipped":true' preview.json; then
            echo "pulado=1" >> "$GITHUB_OUTPUT"
            echo "::notice title=Reel pulado — hoje é dia de carrossel::Cadência 1 peça/dia: o carrossel substitui o Reel a cada 3 dias, e hoje é um deles."
            cat preview.json; echo
            exit 0
          fi
          echo "Prévia recebida:"
          cat preview.json | head -c 400; echo

          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("preview.json", "utf8"));
            const props = {
              title: p.title || "Dr. Libertad",
              slides: Array.isArray(p.slides) ? p.slides : [],
              accentWords: Array.isArray(p.accentWords) ? p.accentWords : [],
              cta: p.cta || "",
              kw: p.kw || "LIBERTAD",
              ed: p.ed || "000",
              // topic: chave do tema (p/ o writeback do footage compartilhar ES↔PT).
              topic: p.topic || "",
              img: p.illustration || undefined,
              cat: p.cat || "freedom",
              handle: p.handle || "@dr.liberdad",
              brand: p.brand || "Dr. Libertad",
              // CTA do Reel no idioma da conta (bug C3): a API manda "Sigue"/"Siga";
              // fallback por idioma (CTA_FOLLOW/CTA_BIO do step) p/ nunca vazar o outro idioma.
              ctaFollow: p.ctaFollow || process.env.CTA_FOLLOW,
              ctaBio: p.ctaBio || process.env.CTA_BIO,
              // Termos de busca de footage gerados pelo Claude (no tema do post).
              videoQueries: Array.isArray(p.videoQueries) ? p.videoQueries : [],
              // Footage COMPARTILHADO entre ES e PT (mesmo vídeo), resolvido e
              // cacheado pela API por (tópico, dia). Vazio → fetch-footage.mjs busca.
              clips: Array.isArray(p.clips) && p.clips.length ? p.clips : undefined,
              // Trilha embutida (camada de criação, opcional). UMA FAIXA POR TEMA:
              // o picker acha no manifest.json a faixa do `topic` do post; sem ela,
              // cai na rotação antiga por `run` (bed-0.mp3, …); sem nenhuma → mudo.
              // PT e ES compartilham os MESMOS arquivos (mesmo tema = mesma faixa).
              music: require("./scripts/pick-music.cjs").pickMusic({ topic: p.topic, run: ${{ steps.params.outputs.run }} }) || undefined,
              // End-card do funil (comment→DM) — presente só quando ENGAGEMENT_FUNNEL_ENABLED;
              // a API já manda a capa do livro + a voz por idioma. Ausente → Reel inalterado.
              funnel: p.funnel || undefined,
              // Narração (voz TTS) — só quando REEL_NARRATION_ENABLED; a API já gerou e
              // devolveu a URL. Ausente → Reel só com música (a música vira leito suave qd há voz).
              narrationUrl: p.narrationUrl || undefined,
              // A MEDIDA da voz (o áudio é o relógio): duração REAL do mp3, tempo de cada
              // palavra e os blocos do roteiro na ordem falada. Com eles o vídeo se
              // dimensiona pela fala e a legenda acende palavra a palavra. SEM eles o
              // render cai na fórmula de slides — por isso precisam estar nesta lista:
              // campo que não é copiado aqui simplesmente não chega ao render.
              narrationDurationSec: p.narrationDurationSec || undefined,
              narrationWords: Array.isArray(p.narrationWords) && p.narrationWords.length ? p.narrationWords : undefined,
              narrationSegments: Array.isArray(p.narrationSegments) && p.narrationSegments.length ? p.narrationSegments : undefined
            };
            // ReelPassos (composição de produção 2026-08-23): title/slides/cta já
            // passaram pelo revisor editorial + guarda §8 (polêmica do dia) + trava
            // anti-idioma (lang-guard.ts) — o redator NÃO MUDA. Este mapa só
            // REORGANIZA o que já saiu dele em steps[] (título=1º passo, cada
            // slide=um passo, cta=bloco final). Fonte única: scripts/reel-passos-map.cjs
            // (mesma função testada em src/lib/reel-passos-map.invariants.test.ts).
            props.steps = require("./scripts/reel-passos-map.cjs").mapContentToPassosSteps({ title: p.title, slides: p.slides, cta: p.cta }).steps;
            fs.writeFileSync("caption.txt", p.caption || p.title || "");
            fs.writeFileSync("slot.txt", p.slot || "noite");
            fs.writeFileSync("topic.txt", p.topic || ""); // → publish-reel (anti-dup cross-formato)
            // A CAPA vai junto ao publish-reel (17/08/2026): é o que o REVISOR FINAL olha.
            // Na nuvem não há ffmpeg para tirar prints do vídeo, então ele confere o quadro
            // que o perfil mostra. Sem esta linha o revisor DECLARA que não olhou — e peça
            // que ninguém olhou não pode passar por peça conferida.
            fs.writeFileSync("cover.txt", p.img || "");
            fs.writeFileSync("reel-props.json", JSON.stringify(props));
            console.log("REEL_PROPS montado (run", "'"${{ steps.params.outputs.run }}"'", "lang", "'"${{ steps.params.outputs.lang }}"'", "):", JSON.stringify(props).slice(0, 280));
          '

      # 5b. Busca footage REAL de banco (Pexels + Pixabay, grátis) no tema do post →
      #     clipes de fundo (movimento real, 5 cenas). NÃO-FATAL: sem PEXELS_API_KEY ou
      #     sem match, segue sem clips e o Reel usa a ilustração estática.
      - name: Buscar footage (Pexels + Pixabay) → clipes de fundo
        if: ${{ steps.content.outputs.pulado != '1' }}
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # 4ª fonte (2026-07-17): Pixabay vídeo+foto entram na mistura de footage.
          # Sem este secret o Pixabay dorme em silêncio (fail-open) e o fallback
          # regride a "só Pexels" — espelha selectFootage do caminho primário.
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # QA de conteúdo do footage (incidente 07-01): visão no poster do clipe.
          # Sem este secret o QA é PULADO (fail-open) — a trava do prompt ainda age.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTAGE_NUM_CLIPS: "5"
          # writeback: se a Pexels for usada aqui (fallback), compartilha o footage
          # achado com a outra conta via /api/reel-share (mesmo vídeo ES↔PT).
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/fetch-footage.mjs --props=reel-props.json

      # 5c. Guarda anti-preto (#3) — cascata footage → ilustração → pular.
      #     Se a Pexels também não trouxe clipes e não há ilustração, tenta gerar a
      #     ilustração da fal (illus=1, raro, ~US$0,03–0,08) como fundo. Se ainda
      #     assim faltar mídia, NÃO publica: Reel preto/quebrado nunca vai ao ar
      #     (caso Nº 102). Regra única em scripts/reel-media.cjs (teste invariante).
      - name: Garantir fundo (footage → ilustração → pular)
        id: media
        if: ${{ steps.content.outputs.pulado != '1' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          has() { node -e 'process.exit(require("./scripts/reel-media.cjs").hasVisualMedia(require("./reel-props.json"))?0:1)'; }
          if has; then
            echo "Fundo OK (footage ou ilustração presente)."
            echo "has_media=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Sem footage e sem ilustração — tentando ilustração (fal) como fallback…"
          FORCEQS=""
          if [ "${{ github.event.inputs.force }}" = "yes" ]; then FORCEQS="&force=1"; fi
          curl -fsS --max-time 200 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.drlibertad.com/api/publish?preview=1&illus=1${{ steps.params.outputs.langqs }}&run=${{ steps.params.outputs.run }}$FORCEQS" \
            -o illus.json || echo "(chamada de ilustração falhou)"
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("reel-props.json", "utf8"));
            let ill = null;
            try { ill = JSON.parse(fs.readFileSync("illus.json", "utf8")).illustration || null; } catch {}
            if (ill) { p.img = ill; fs.writeFileSync("reel-props.json", JSON.stringify(p)); console.log("ilustração de fallback aplicada"); }
            else { console.log("sem ilustração de fallback"); }
          '
          if has; then
            echo "has_media=1" >> "$GITHUB_OUTPUT"
          else
            echo "has_media=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=Reel pulado::Sem footage nem ilustração — não publicamos Reel preto (#3)."
          fi

      # 5d. TRAVA DE PEÇA PRONTA + LOOP DE CORREÇÃO (ordem do dono 15/08: "deve chegar
      #     o texto, o audio e imagens e video" antes de publicar). O teste real de
      #     15/08 pegou `faltou: imagens` e o dono reprovou o comportamento passivo:
      #     "o trabalho deve ser 100% efetivado, se faltar algo ele tem que corrigir,
      #     tem que criar um looping em cada uma das travas… está conferido 100% siga a
      #     proxima etapa, não está volte e refaça, até finalir". Agora, faltou um dos
      #     4 componentes (texto · áudio · imagens · vídeo) → o motor CORRIGE:
      #       vídeo   → re-roda fetch-footage (Pexels+Pixabay, GRÁTIS);
      #       imagens → re-obtém o preview com illus=1 (ilustração da fal, ~US$0,03–0,08,
      #                 DENTRO do teto ig-reels — autorização = teto ativo + ordem de corrigir);
      #       texto/áudio → re-obtém o preview (cache content_cache/narration_cache,
      #                 não re-paga o que já existe — só completa o que faltou).
      #     E RE-CONFERE em loop até 100% (teto 3 tentativas) — só então pronto=1 e os
      #     passos render/upload/publicar seguem. Fail-closed no fim: não resolveu →
      #     pronto=0 (o catchup redispara a vaga). Lógica única em scripts/reel-media.cjs
      #     (corrigirAtePronto) e scripts/corrigir-reel.mjs (o corretor real); teste invariante.
      - name: Verificar e CORRIGIR Reel pronto (loop até 100%)
        id: pronto
        if: ${{ steps.media.outputs.has_media == '1' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RUN: ${{ steps.params.outputs.run }}
          LANGQS: ${{ steps.params.outputs.langqs }}
          FORCE: ${{ github.event.inputs.force == 'yes' && '1' || '' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTAGE_NUM_CLIPS: "5"
        run: node scripts/corrigir-reel.mjs

      # 6. Renderiza o Reel para out/reel.mp4 (só se há fundo de verdade).
      #    Composição de produção = ReelPassos (grid+numeral+barra-de-progresso,
      #    fundo preto puro), promovida 2026-08-23. `has_media`/`pronto` continuam
      #    exigindo footage+ilustração+narração no reel-props.json (mesma trava de
      #    sempre, composição-agnóstica) mesmo que ReelPassos não os desenhe —
      #    ReelPassos toca só a cama musical (props.music); ver video/ReelPassos.tsx.
      - name: Renderizar Reel (Remotion)
        if: ${{ steps.media.outputs.has_media == '1' && steps.pronto.outputs.pronto == '1' }}
        run: node scripts/render-reel.mjs --props=reel-props.json --composition=ReelPassos

      # TEMPORARIO (branch de teste, reverter): sobe o mp4 renderizado como ARTEFATO do
      # GitHub Actions (privado, nunca publicado em rede social) mesmo que a conferência
      # de áudio/tipografia barre o upload pro Release — só para inspeção manual dos frames.
      - name: "[TESTE] Guardar mp4 renderizado como artefato (não publica em lugar nenhum)"
        if: ${{ steps.media.outputs.has_media == '1' && steps.pronto.outputs.pronto == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: reelpassos-teste-render
          path: out/reel.mp4
          retention-days: 1

      # 6b. CONFERE A PEÇA PRONTA — o arquivo, não os campos dele (18/08/2026).
      #     O dono viu o Reel BR no ar e reprovou: "a voz está cortada, a legenda com
      #     caracteres". Todos os robôs estavam verdes, porque nenhum media o mp4: a trava
      #     do "100%" pergunta se os CAMPOS existem, e o revisor da nuvem olha a CAPA.
      #     Aqui o ffmpeg mede o que vai ao feed — tem som? o som cobre o fim? o texto usa
      #     caractere que a fonte desenha? A tipografia ele CONSERTA e pede render novo;
      #     o resto ele BARRA (a vaga fica aberta e o catchup a redispara).
      # O medidor de vídeo NÃO vem na imagem do runner (medido 19/08: os 2 Reels agendados
      # foram barrados porque `ffprobe` não existia e a leitura voltou "0,0 s · sem trilha").
      # Instalar custa ~20 s e é grátis; sem ele a conferência DECLARA que não mediu e deixa
      # passar — mas aí a peça vai ao ar sem ninguém ouvir o fim, que é o defeito de 18/08.
      - name: Garantir ffmpeg (medidor da peça)
        if: ${{ steps.media.outputs.has_media == '1' && steps.pronto.outputs.pronto == '1' }}
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffprobe -version | head -1

      - name: Conferir a peça pronta (som, fim mudo, tipografia)
        id: conferir
        if: ${{ steps.media.outputs.has_media == '1' && steps.pronto.outputs.pronto == '1' }}
        run: node scripts/conferir-render.mjs

      - name: Renderizar de novo (tipografia corrigida)
        if: ${{ steps.conferir.outputs.recorrigir == '1' }}
        run: node scripts/render-reel.mjs --props=reel-props.json --composition=ReelPassos

      - name: Conferir a peça pronta (2ª e última passada)
        id: conferir2
        if: ${{ steps.conferir.outputs.recorrigir == '1' }}
        env:
          JA_CORRIGIU: "1"
        run: node scripts/conferir-render.mjs

      # A capa que o revisor final OLHA sai do estado ATUAL da peça: o passo 2 escreveu
      # cover.txt antes de o corretor obter a ilustração, e por isso o Reel de 18/08 chegou
      # ao publish sem capa — o revisor final registrou "não rodou". Aqui ela é regravada.
      - name: Regravar a capa para o revisor final
        if: ${{ steps.media.outputs.has_media == '1' && steps.pronto.outputs.pronto == '1' }}
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("reel-props.json", "utf8"));
            const capa = (p.img && String(p.img).trim()) || (Array.isArray(p.clips) && p.clips[0]) || "";
            fs.writeFileSync("cover.txt", capa);
            console.log(capa ? "[cover] capa para o revisor final: " + capa.slice(0, 80) : "[cover] a peça não tem capa — o revisor final vai DECLARAR que não olhou");
          '

      # 7. Sobe o mp4 como asset de um GitHub Release (repo PÚBLICO) e captura a URL
      #    pública (stdout). PONTE de emergência 2026-07-15: o Vercel Blob suspendeu as
      #    stores da conta inteira (BlobStoreSuspendedError) → 0 reel. O Release dá URL
      #    pública que a Graph API busca, sem conta nova nem cartão. Destino definitivo
      #    é o Cloudflare R2 (upload-r2.mjs, PR #166) quando o dono provisionar; o
      #    upload-blob.mjs fica preservado p/ rollback.
      - name: Upload do mp4 para GitHub Release (ponte)
        id: upload
        if: ${{ steps.media.outputs.has_media == '1' && steps.pronto.outputs.pronto == '1' && (steps.conferir.outputs.render_ok == '1' || steps.conferir2.outputs.render_ok == '1') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(node scripts/upload-release.mjs)
          echo "URL do vídeo: $URL"
          echo "video_url=$URL" >> "$GITHUB_OUTPUT"

      # 7b. Modo preview: no disparo manual com publish=no, NÃO publica — só expõe a
      #     URL do mp4 p/ revisar a criação. O cron (schedule) sempre publica.
      - name: Preview (sem publicar)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'yes' && steps.media.outputs.has_media == '1' && steps.pronto.outputs.pronto == '1' && (steps.conferir.outputs.render_ok == '1' || steps.conferir2.outputs.render_ok == '1') }}
        run: |
          echo "::notice title=Reel pronto (preview, não publicado)::${{ steps.upload.outputs.video_url }}"
          echo "Preview do Reel (NÃO publicado): ${{ steps.upload.outputs.video_url }}"

      # 8. Publica o Reel no Instagram via /api/publish-reel (polling de status).
      #     Roda no cron (schedule) ou no disparo manual com publish=yes — e só se
      #     houver fundo (has_media): Reel sem footage/ilustração é pulado, não preto.
      - name: Publicar Reel no Instagram
        if: ${{ (github.event_name == 'schedule' || github.event.inputs.publish == 'yes') && steps.media.outputs.has_media == '1' && steps.pronto.outputs.pronto == '1' && (steps.conferir.outputs.render_ok == '1' || steps.conferir2.outputs.render_ok == '1') }}
        run: |
          RESP=$(curl -sS --max-time 280 -G \
            -w $'\nHTTP_CODE:%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --data-urlencode "video=${{ steps.upload.outputs.video_url }}" \
            --data-urlencode "caption@caption.txt" \
            --data-urlencode "slot=$(cat slot.txt)" \
            --data-urlencode "run=${{ steps.params.outputs.run }}" \
            --data-urlencode "topic@topic.txt" \
            --data-urlencode "cover@cover.txt" \
            "https://www.drlibertad.com/api/publish-reel${{ steps.params.outputs.reelqs }}")
          echo "Resposta do servidor:"
          echo "$RESP"
          echo "$RESP" | grep -q '"ok":true' || { echo "::error::Publicação falhou"; exit 1; }
          echo "Reel publicado (lang=${{ steps.params.outputs.lang }})."
