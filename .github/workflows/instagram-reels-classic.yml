name: Instagram Reel CLÁSSICO — Dr. Libertad / Dr. Liberdade (ES + BR)

# Reel no estilo ANTIGO (slide animado sobre a ilustração da fal) — mantido como
# estava, rodando em paralelo ao motor de vídeo (footage). Foi o formato que gerou
# o melhor Reel até agora (insights), por isso preservado.
#
# WORKFLOW ÚNICO ES+PT (fusão 2026-07-14): antes eram 2 arquivos quase idênticos
# (instagram-reels-classic.yml + -pt.yml) que DIVERGIAM à mão. Agora `lang` vem da
# EXPRESSÃO cron (github.event.schedule) — fonte única, sem drift. ES às 19:17 BRT,
# PT às 19:22 (5 min depois, p/ reusar a ilustração já cacheada). Tópico = run 3.
#
# BLINDAGEM DO 4º REEL: o clássico depende da ilustração da fal (não tinha footage de
# reserva) — se a ilustração falhasse (402 de orçamento, fal fora, QA reprovando), o
# slot das 19h NÃO saía. Cascata: ilustração → footage (Pexels) → pular. Com ilustração
# renderiza "ReelClassic" (slide); sem ela, vira um Reel de FOOTAGE ("Reel").

on:
  schedule:
    - cron: "17 22 * * *" # 19:17 BRT — ES run 3
    - cron: "22 22 * * *" # 19:22 BRT — PT run 3 (5 min após o ES)
  workflow_dispatch:
    inputs:
      lang:
        description: "Idioma (es | br). Default es."
        required: false
        default: "es"
      run:
        description: "Run p/ escolher o tópico (vazio = run 3)"
        required: false
        default: ""
      publish:
        description: "Publicar no Instagram? (no = só renderiza p/ preview)"
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]

concurrency:
  group: instagram-reels-classic-${{ github.event.schedule || github.event.inputs.lang }}-${{ github.event.inputs.run }}
  cancel-in-progress: false

jobs:
  reel-classic:
    runs-on: ubuntu-latest
    # contents: write → o passo de upload cria/atualiza o GitHub Release que hospeda o mp4.
    permissions:
      contents: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      # run 3 (e lang) do agendamento; input ou default no disparo manual.
      - name: Determinar run e idioma
        id: params
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_LANG: ${{ github.event.inputs.lang }}
          IN_RUN: ${{ github.event.inputs.run }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            RUN="${IN_RUN:-3}"
            LANG="${IN_LANG:-es}"
          else
            case "$SCHEDULE" in
              "17 22 * * *") RUN=3; LANG=es ;;
              "22 22 * * *") RUN=3; LANG=br ;;
              *) RUN=3; LANG=es ;;  # fallback defensivo
            esac
          fi
          [ "$LANG" = "pt" ] && LANG=br  # aceita o codigo LEGADO de chamada antiga (catchup/curl velho)
          [ "$LANG" != "br" ] && LANG=es  # normaliza qualquer valor inesperado p/ es
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "lang=$LANG" >> "$GITHUB_OUTPUT"
          if [ "$LANG" = "br" ]; then
            echo "langqs=&lang=br" >> "$GITHUB_OUTPUT"
            echo "reelqs=?lang=br" >> "$GITHUB_OUTPUT"
            echo "cta_follow=Siga" >> "$GITHUB_OUTPUT"
            echo "cta_bio=→ Mais no link da bio" >> "$GITHUB_OUTPUT"
          else
            echo "langqs=" >> "$GITHUB_OUTPUT"
            echo "reelqs=" >> "$GITHUB_OUTPUT"
            echo "cta_follow=Sigue" >> "$GITHUB_OUTPUT"
            echo "cta_bio=→ Más en el link de la bio" >> "$GITHUB_OUTPUT"
          fi
          echo "Run escolhido: $RUN (lang=$LANG)"

      # Conteúdo + tentativa de ILUSTRAÇÃO (clássico usa a imagem da fal de fundo).
      # NÃO-FATAL: se o gate de orçamento / a fal derrubar (402/5xx), cai pro conteúdo
      # SEM ilustração e o slot vira um Reel de FOOTAGE — o run 3 nunca fica sem sair
      # por causa da ilustração.
      - name: Obter conteúdo (preview, tenta ilustração) e montar REEL_PROPS
        id: content
        env:
          CTA_FOLLOW: ${{ steps.params.outputs.cta_follow }}
          CTA_BIO: ${{ steps.params.outputs.cta_bio }}
        run: |
          AUTH="Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          RUN="${{ steps.params.outputs.run }}"
          LANGQS="${{ steps.params.outputs.langqs }}"
          HTTP=$(curl -sS -o preview.json -w "%{http_code}" --max-time 200 -H "$AUTH" \
            "https://www.drlibertad.com/api/publish?preview=1&illus=1${LANGQS}&run=$RUN" || echo 000)
          echo "preview (com ilustração): HTTP $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "::warning title=Clássico sem ilustração::HTTP $HTTP no preview illus=1 — caindo pra footage."
            # Sem a ilustração paga o Reel ainda sai de footage. Mas se o segundo
            # pedido também vier 402, é o FREIO DE GASTO fechado (tetos zerados pelo
            # dono em 05/08/2026): ordem obedecida não é defeito — vira aviso e o robô
            # encerra em paz, em vez de mandar e-mail de erro a cada disparo.
            HTTP2=$(curl -sS -o preview.json -w "%{http_code}" --max-time 480 -H "$AUTH" \
              "https://www.drlibertad.com/api/publish?preview=1${LANGQS}&run=$RUN" || echo 000)
            if [ "$HTTP2" = "402" ]; then
              echo "pulado=1" >> "$GITHUB_OUTPUT"
              echo "::warning title=Reel clássico pulado — gasto desligado::O teto de gasto está em zero (ordem do dono, 05/08/2026). Nada foi publicado. Religar = o dono dizer o número."
              cat preview.json; echo
              exit 0
            fi
            if [ "$HTTP2" != "200" ]; then
              echo "::error title=Falha ao obter conteúdo::HTTP $HTTP2"
              cat preview.json; echo
              exit 1
            fi
          fi
          echo "Prévia recebida:"; cat preview.json | head -c 400; echo

          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("preview.json", "utf8"));
            const props = {
              title: p.title || "Dr. Libertad",
              slides: Array.isArray(p.slides) ? p.slides : [],
              accentWords: Array.isArray(p.accentWords) ? p.accentWords : [],
              cta: p.cta || "",
              kw: p.kw || "LIBERTAD",
              ed: p.ed || "000",
              topic: p.topic || "",
              img: p.illustration || undefined,
              cat: p.cat || "freedom",
              handle: p.handle || "@dr.liberdad",
              brand: p.brand || "Dr. Libertad",
              // Fallback de CTA por idioma (CTA_FOLLOW/CTA_BIO do step): nunca vaza o outro idioma.
              ctaFollow: p.ctaFollow || process.env.CTA_FOLLOW,
              ctaBio: p.ctaBio || process.env.CTA_BIO,
              // Footage de RESERVA (quando não há ilustração): termos do Claude + clipes.
              videoQueries: Array.isArray(p.videoQueries) ? p.videoQueries : [],
              clips: Array.isArray(p.clips) && p.clips.length ? p.clips : undefined,
              // Trilha embutida — UMA FAIXA POR TEMA via manifest.json (pelo `topic`);
              // sem faixa → rotação legado por `run`; sem nenhuma → mudo. PT e ES compartilham.
              music: require("./scripts/pick-music.cjs").pickMusic({ topic: p.topic, run: ${{ steps.params.outputs.run }} }) || undefined
            };
            fs.writeFileSync("caption.txt", p.caption || p.title || "");
            fs.writeFileSync("slot.txt", p.slot || "noite");
            fs.writeFileSync("topic.txt", p.topic || ""); // → publish-reel (anti-dup cross-formato)
            fs.writeFileSync("reel-props.json", JSON.stringify(props));
            console.log("REEL_PROPS (classic) montado:", JSON.stringify(props).slice(0, 280));
          '

      # Decide o fundo: ILUSTRAÇÃO presente → Reel CLÁSSICO (slide, formato campeão).
      # Sem ilustração → busca footage (Pexels, grátis) e o slot publica um Reel de
      # FOOTAGE. Sem nenhum dos dois → pula (nunca publica Reel preto; regra única em
      # scripts/reel-media.cjs). É a cascata robusta do Reel de footage no clássico.
      - name: Garantir fundo (ilustração → footage → pular)
        id: media
        if: ${{ steps.content.outputs.pulado != '1' }}
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # 4ª fonte (2026-07-17): Pixabay vídeo+foto entram na mistura de footage.
          # Sem este secret o Pixabay dorme em silêncio (fail-open) e o fallback
          # regride a "só Pexels" — espelha selectFootage do caminho primário.
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # QA de conteúdo do footage (incidente 07-01): visão no poster do clipe.
          # Sem este secret o QA é PULADO (fail-open) — a trava do prompt ainda age.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTAGE_NUM_CLIPS: "5"
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          hasImg() { node -e 'const p=require("./reel-props.json"); process.exit(typeof p.img==="string"&&p.img.trim()?0:1)'; }
          hasMedia() { node -e 'process.exit(require("./scripts/reel-media.cjs").hasVisualMedia(require("./reel-props.json"))?0:1)'; }
          if hasImg; then
            echo "Ilustração presente → Reel CLÁSSICO (slide)."
            echo "composition=ReelClassic" >> "$GITHUB_OUTPUT"
            echo "has_media=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Sem ilustração — buscando footage (Pexels) p/ Reel de footage…"
          node scripts/fetch-footage.mjs --props=reel-props.json || echo "(footage falhou)"
          if hasMedia; then
            echo "Footage OK → Reel de footage (fallback do clássico)."
            echo "composition=Reel" >> "$GITHUB_OUTPUT"
            echo "has_media=1" >> "$GITHUB_OUTPUT"
          else
            echo "has_media=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=Reel clássico pulado::Sem ilustração nem footage — não publicamos Reel preto."
          fi

      # Renderiza a composição escolhida (ReelClassic = slide; Reel = footage).
      - name: Renderizar Reel (Remotion)
        if: ${{ steps.media.outputs.has_media == '1' }}
        run: node scripts/render-reel.mjs --props=reel-props.json --composition=${{ steps.media.outputs.composition }}

      # Upload do mp4 → GitHub Release (ponte 2026-07-15: Blob suspenso; R2 é o destino
      # definitivo, PR #166). upload-blob.mjs preservado p/ rollback.
      - name: Upload do mp4 para GitHub Release (ponte)
        id: upload
        if: ${{ steps.media.outputs.has_media == '1' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(node scripts/upload-release.mjs)
          echo "URL do vídeo: $URL"
          echo "video_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Preview (sem publicar)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'yes' && steps.media.outputs.has_media == '1' }}
        run: |
          echo "::notice title=Reel clássico pronto (preview)::${{ steps.upload.outputs.video_url }}"
          echo "Preview (NÃO publicado): ${{ steps.upload.outputs.video_url }}"

      - name: Publicar Reel no Instagram
        if: ${{ (github.event_name == 'schedule' || github.event.inputs.publish == 'yes') && steps.media.outputs.has_media == '1' }}
        run: |
          RESP=$(curl -sS --max-time 280 -G \
            -w $'\nHTTP_CODE:%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --data-urlencode "video=${{ steps.upload.outputs.video_url }}" \
            --data-urlencode "caption@caption.txt" \
            --data-urlencode "slot=$(cat slot.txt)" \
            --data-urlencode "run=${{ steps.params.outputs.run }}" \
            --data-urlencode "topic@topic.txt" \
            "https://www.drlibertad.com/api/publish-reel${{ steps.params.outputs.reelqs }}")
          echo "Resposta do servidor:"
          echo "$RESP"
          echo "$RESP" | grep -q '"ok":true' || { echo "::error::Publicação falhou"; exit 1; }
          echo "Reel clássico publicado (lang=${{ steps.params.outputs.lang }})."
